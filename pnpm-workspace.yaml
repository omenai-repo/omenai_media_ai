packages:
  - apps/*
  - packages/*

# Versions shared by several workspace packages. Reference them with "catalog:".
catalog:
  '@types/node': ^24.19.2
  eslint: ^9.39.5
  # typescript-eslint supports TypeScript < 6.1, so stay on 6.0.x.
  typescript: ~6.0.3
  vite: ^8.3.4
  vitest: ^5.0.3
  zod: ^4.6.5

# Dependencies allowed to run install scripts (pnpm blocks all others by default).
allowBuilds:
  esbuild: true
  unrs-resolver: true
  # Its postinstall only pre-downloads mongod; tests download it lazily on first run instead.
  mongodb-memory-server: false
  # trigger.dev CLI helper for remote deploy builds; revisit when first running `trigger deploy`.
  '@depot/cli': false
  # Transitive deps of @google/genai. protobufjs's postinstall only checks for an optional CLI
  # version scheme; genai's preinstall is an echo. Neither is needed at runtime. Without an
  # explicit decision, pnpm 12 fails `pnpm install` in CI (ERR_PNPM_IGNORED_BUILDS).
  '@google/genai': false
  protobufjs: false

minimumReleaseAgeExclude:
  - '@trigger.dev/core@4.7.4'
  - '@trigger.dev/sdk@4.7.4'
  - '@trigger.dev/build@4.7.4'
  - '@trigger.dev/schema-to-json@4.7.4'
  - trigger.dev@4.7.4
  - '@anthropic-ai/sdk@0.134.0'
  - '@google/genai@2.30.0'
  - resend@6.33.0
